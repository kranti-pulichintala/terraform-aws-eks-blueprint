name: Push portfolio projects
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push files to all repos
        env:
          TOKEN: ${{ secrets.PORTFOLIO_PAT }}
        run: |-
          node <<'SCRIPT_EOF'
          const fs = require("fs");
          const TOKEN = process.env.TOKEN;
          const OWNER = "kranti-pulichintala";
          const DATA = JSON.parse(fs.readFileSync("payload.json", "utf8"));
          async function gh(method, path, body) {
            const r = await fetch("https://api.github.com" + path, { method,
              headers: {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                        "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
              body: body ? JSON.stringify(body) : undefined });
            const t = await r.text();
            if (!r.ok) throw new Error(method + " " + path + " -> " + r.status + " " + t.slice(0, 300));
            return r.status === 204 ? null : JSON.parse(t);
          }
          (async () => {
            const out = [];
            for (const [repo, files] of Object.entries(DATA.repos)) {
              try {
                let baseSha = null, baseTree = null;
                try {
                  const ref = await gh("GET", "/repos/" + OWNER + "/" + repo + "/git/ref/heads/main");
                  baseSha = ref.object.sha;
                  baseTree = (await gh("GET", "/repos/" + OWNER + "/" + repo + "/git/commits/" + baseSha)).tree.sha;
                } catch (e) {}
                const entries = [];
                for (const [p, b64] of Object.entries(files)) {
                  const b = await gh("POST", "/repos/" + OWNER + "/" + repo + "/git/blobs", {content: b64, encoding: "base64"});
                  entries.push({path: p, mode: "100644", type: "blob", sha: b.sha});
                }
                const tp = {tree: entries}; if (baseTree) tp.base_tree = baseTree;
                const tree = await gh("POST", "/repos/" + OWNER + "/" + repo + "/git/trees", tp);
                const cp = {message: "Add " + repo + " portfolio project", tree: tree.sha};
                if (baseSha) cp.parents = [baseSha];
                const c = await gh("POST", "/repos/" + OWNER + "/" + repo + "/git/commits", cp);
                if (baseSha) await gh("PATCH", "/repos/" + OWNER + "/" + repo + "/git/refs/heads/main", {sha: c.sha});
                else await gh("POST", "/repos/" + OWNER + "/" + repo + "/git/refs", {ref: "refs/heads/main", sha: c.sha});
                out.push(repo + " OK " + c.sha.slice(0, 7));
              } catch (e) { out.push(repo + " FAILED: " + e.message); }
            }
            try {
              const repo = "terraform-aws-eks-blueprint";
              const ref = await gh("GET", "/repos/" + OWNER + "/" + repo + "/git/ref/heads/main");
              const ct = await gh("GET", "/repos/" + OWNER + "/" + repo + "/git/commits/" + ref.object.sha);
              const tree = await gh("POST", "/repos/" + OWNER + "/" + repo + "/git/trees",
                {base_tree: ct.tree.sha, tree: [{path: "payload.json", mode: "100644", type: "blob", sha: null}]});
              const c = await gh("POST", "/repos/" + OWNER + "/" + repo + "/git/commits",
                {message: "Remove staging payload", tree: tree.sha, parents: [ref.object.sha]});
              await gh("PATCH", "/repos/" + OWNER + "/" + repo + "/git/refs/heads/main", {sha: c.sha});
              out.push("payload.json cleanup OK");
            } catch (e) { out.push("payload.json cleanup FAILED: " + e.message); }
            console.log("PUSH COMPLETE");
            for (const line of out) console.log(line);
          })().catch(e => { console.error("PUSH FAILED", e.message); process.exit(1); });
          SCRIPT_EOF
